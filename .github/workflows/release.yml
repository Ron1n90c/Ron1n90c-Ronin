name: Package and release

# Tag a version (for example v2.0.2) to package the Ronin folder and upload it
# to CurseForge and GitHub Releases. "Run workflow" with dry_run = true only
# builds the zip and uploads nothing, so you can check it first.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["Ronin.toc"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        type: boolean
        default: true
      tag:
        description: "Tag to create for a real release (for example v2.1.0)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag != '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
      - name: Auto release from the version in Ronin.toc
        id: auto
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^## Version:' Ronin.toc | sed 's/## Version: *//' | tr -d '\r ')
          echo "release=no" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "v$VER already released"; exit 0; fi
          # start the same run you would start by hand (Run workflow, dry_run off, tag v$VER)
          gh workflow run release.yml --ref main -f dry_run=false -f tag="v$VER"
          echo "Started the release run for v$VER"
      - uses: BigWigsMods/packager@v2
        if: ${{ steps.auto.outputs.release != 'no' }}
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-d' || '' }} -p ${{ vars.CF_PROJECT_ID }}
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Ronin-dry-run
          path: .release/*.zip
